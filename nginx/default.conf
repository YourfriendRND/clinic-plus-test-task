# Монтируется как /etc/nginx/conf.d/default.conf (http-контекст образа nginx)
# один connect.sid => одна реплика API (handshake и кадры WS не прыгают между процессами)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# $cookie_connect_sid пустой: nginx плохо читает cookie с точкой в имени.
# Без стабильного ключа polling-handshake и websocket уходят на разные реплики
map $http_cookie $api_sticky {
    default $remote_addr;
    "~*connect\\.sid=(?<sticky>[^;]+)" $sticky;
}

upstream api {
    hash $api_sticky consistent;
    server api-1:4000;
    server api-2:4000;
}

upstream web {
    server web:3000;
}

server {
    listen 80;
    server_name _;

    location /socket.io {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 28800s; # 8 часов
        proxy_send_timeout 28800s; # 8 часов
    }

    # swagger-ui-express редиректит /docs на /docs/, без этого Location теряет префикс /api
    location = /api/docs {
        return 301 /api/docs/;
    }

    location /api/ {
        proxy_pass http://api/;
        proxy_redirect /docs/ /api/docs/;
        proxy_redirect /docs /api/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
